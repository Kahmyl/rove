name: Documentation review
on:
  push:
    branches: [docs/product-foundation]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare native database and browser
        run: |
          pnpm --filter @rove/companion exec npm rebuild better-sqlite3
          pnpm --filter @rove/browser exec playwright install --with-deps chromium
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck > /tmp/rove-typecheck.log 2>&1
      - name: Build
        id: build
        continue-on-error: true
        run: pnpm build > /tmp/rove-build.log 2>&1
      - name: Deterministic tests
        id: tests
        continue-on-error: true
        run: xvfb-run -a pnpm test -- --reporter=json --outputFile=/tmp/rove-tests.json > /tmp/rove-tests.log 2>&1
      - name: Save check outcomes
        if: always()
        run: |
          printf 'typecheck=%s\nbuild=%s\ntests=%s\n' '${{ steps.typecheck.outcome }}' '${{ steps.build.outcome }}' '${{ steps.tests.outcome }}' > /tmp/rove-checks.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-baseline-checks
          path: /tmp/rove-*
          retention-days: 1
      - name: Report check failures
        if: always()
        run: |
          test '${{ steps.typecheck.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
