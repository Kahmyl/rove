name: rove

x-node-build: &node-build
  context: .
  dockerfile: docker/Dockerfile.dev

services:
  runtime:
    build: *node-build
    environment:
      ROVE_HOME: /workspace/.rove
      ROVE_RUNTIME_HOST: 0.0.0.0
      ROVE_RUNTIME_PORT: 47820
      # Published only on host loopback. Override this development token via
      # ROVE_RUNTIME_TOKEN in environments shared with other users.
      ROVE_RUNTIME_TOKEN: ${ROVE_RUNTIME_TOKEN:-rove-local-compose-token-change-me}
      ROVE_BROWSER_HEADLESS: "true"
      ROVE_BROWSER: chromium
    command: ["pnpm", "--filter", "@rove/runtime", "dev"]
    ports:
      - "127.0.0.1:${ROVE_RUNTIME_PORT:-47820}:47820"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:47820/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - rove-data:/workspace/.rove
    restart: unless-stopped
    stop_grace_period: 10s
    shm_size: 1gb
    init: true
    develop:
      watch:
        - action: sync
          path: apps/runtime/src
          target: /workspace/apps/runtime/src
        - action: rebuild
          path: packages/protocol/src
        - action: rebuild
          path: packages/browser/src
        - action: rebuild
          path: packages/storage/src
        - action: rebuild
          path: packages/config/src
        - action: rebuild
          path: apps/runtime/package.json
        - action: rebuild
          path: pnpm-lock.yaml

  mcp:
    build: *node-build
    depends_on:
      runtime:
        condition: service_healthy
    environment:
      ROVE_HOME: /workspace/.rove
      ROVE_RUNTIME_URL: http://runtime:47820
      ROVE_RUNTIME_TOKEN: ${ROVE_RUNTIME_TOKEN:-}
      ROVE_MCP_TRANSPORT: http
      ROVE_MCP_HOST: 0.0.0.0
      ROVE_MCP_PORT: 47821
      ROVE_MCP_PATH: /mcp
      ROVE_MCP_TOKEN: ${ROVE_MCP_TOKEN:-rove-local-development-token-123456}
      ROVE_MCP_ALLOWED_HOSTS: 127.0.0.1:47821,localhost:47821,0.0.0.0:47821,mcp:47821
    command: ["pnpm", "--filter", "@rove/mcp", "dev"]
    ports:
      - "127.0.0.1:${ROVE_MCP_PORT:-47821}:47821"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:47821/health',{headers:{host:'127.0.0.1:47821'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - rove-data:/workspace/.rove
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    develop:
      watch:
        - action: sync
          path: apps/mcp/src
          target: /workspace/apps/mcp/src
        - action: rebuild
          path: packages/protocol/src
        - action: rebuild
          path: packages/config/src
        - action: rebuild
          path: apps/mcp/package.json
        - action: rebuild
          path: pnpm-lock.yaml

volumes:
  rove-data:
