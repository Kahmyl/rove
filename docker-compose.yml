name: rove

x-node-build: &node-build
  context: .
  dockerfile: docker/Dockerfile.dev

services:
  control-plane:
    build: *node-build
    environment:
      ROVE_CONTROL_PLANE_HOST: 0.0.0.0
      ROVE_CONTROL_PLANE_PORT: 47830
      ROVE_HUB_TOKEN: ${ROVE_HUB_TOKEN:-rove-local-hub-token-change-me}
      ROVE_CONTROL_PLANE_SERVICE_TOKEN: ${ROVE_CONTROL_PLANE_SERVICE_TOKEN:-rove-local-service-token-change-me}
    command: ["pnpm", "--filter", "@rove/control-plane", "start"]
    ports:
      - "127.0.0.1:${ROVE_CONTROL_PLANE_PORT:-47830}:47830"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:47830/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    develop:
      watch:
        - action: rebuild
          path: apps/control-plane/src
        - action: rebuild
          path: packages/protocol/src
        - action: rebuild
          path: apps/control-plane/package.json
        - action: rebuild
          path: pnpm-lock.yaml

  mcp:
    build: *node-build
    depends_on:
      control-plane:
        condition: service_healthy
    environment:
      ROVE_CONTROL_PLANE_URL: http://control-plane:47830
      ROVE_CONTROL_PLANE_SERVICE_TOKEN: ${ROVE_CONTROL_PLANE_SERVICE_TOKEN:-rove-local-service-token-change-me}
      ROVE_HUB_DEVICE_ID: ${ROVE_HUB_DEVICE_ID:-local-dev}
      ROVE_MCP_TRANSPORT: http
      ROVE_MCP_HOST: 0.0.0.0
      ROVE_MCP_PORT: 47821
      ROVE_MCP_PATH: /mcp
      ROVE_MCP_TOKEN: ${ROVE_MCP_TOKEN:-rove-local-development-token-123456}
      ROVE_MCP_ALLOWED_HOSTS: 127.0.0.1:47821,localhost:47821,0.0.0.0:47821,mcp:47821
    command: ["pnpm", "--filter", "@rove/mcp", "start"]
    ports:
      - "127.0.0.1:${ROVE_MCP_PORT:-47821}:47821"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:47821/live',{headers:{host:'127.0.0.1:47821'}}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    stop_grace_period: 10s
    init: true
    develop:
      watch:
        - action: rebuild
          path: apps/mcp/src
        - action: rebuild
          path: packages/protocol/src
        - action: rebuild
          path: packages/config/src
        - action: rebuild
          path: apps/mcp/package.json
        - action: rebuild
          path: pnpm-lock.yaml
